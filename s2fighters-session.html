<style>
  /* Layout: one arcade monitor (224x288 vertical raster) centered in a dark cabinet, controls strip beneath. */
  :root {

    color-scheme: dark;

  body { background: var(--cabinet); color: var(--ink); font-family: var(--pixel); }
  .wrap {
    min-height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding-inline: 16px; padding-block: 12px;
  }
  .screen {
    width: min(100%, calc((100vh - 96px) * 224 / 288));
    width: min(100%, calc((100dvh - 96px) * 224 / 288));
    min-width: 200px; max-width: 100%;
    aspect-ratio: 224 / 288;
    background: #000;
    border: 6px solid var(--bezel);
    outline: 1px solid var(--bezel-edge);
    border-radius: 14px;
    box-shadow: 0 0 46px var(--glow), inset 0 0 30px #000;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
  canvas.crt { filter: saturate(1.2) contrast(1.06) brightness(1.06); border-radius: 10px; }
  .screen:fullscreen { width: auto; height: 100%; border: 0; border-radius: 0; margin: 0 auto; }
  .pad { display: none; width: 100%; max-width: 420px; gap: 10px; }
  .pad button {
    flex: 1; min-height: 64px; font-family: inherit; font-size: 20px; color: var(--ink);
    background: var(--bezel); border: 1px solid var(--bezel-edge); border-radius: 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .pad button.fire { flex: 1.4; font-size: 15px; letter-spacing: 0.08em; color: #fff; background: #5a0a1e; border-color: var(--hot); }
  .pad button.on { filter: brightness(1.6); }
  @media (pointer: coarse) {
    .pad { display: flex; }
    .screen { width: min(100%, calc((100vh - 200px) * 224 / 288)); width: min(100%, calc((100dvh - 200px) * 224 / 288)); }
    .bar .keys { display: none; }
  }
  #audStatus { flex-basis: 100%; color: var(--ink); }
  #audStatus:empty { display: none; }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 18px;
    font-size: 11px; letter-spacing: 0.04em; color: var(--dim); text-align: center;
  }
  .bar kbd { font-family: inherit; color: var(--ink); border: 1px solid var(--bezel-edge); border-radius: 3px; padding: 0 4px; }
  .bar button {
    font-family: inherit; font-size: 11px; letter-spacing: 0.06em; color: var(--ink);
    background: var(--bezel); border: 1px solid var(--bezel-edge); border-radius: 4px; padding: 5px 10px; cursor: pointer;
  }
  .bar button:hover { border-color: var(--hot); }
  .bar button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
</style>

<div class="wrap">
  <div class="screen" id="screen"><canvas id="cv" class="crt" aria-label="S2Fighters game screen"></canvas></div>
  <div class="pad" aria-label="Touch controls">
    <button type="button" data-k="left" aria-label="Move left">◀</button>
    <button type="button" data-k="fire" class="fire" aria-label="Fire">FIRE</button>
    <button type="button" data-k="right" aria-label="Move right">▶</button>
  </div>
  <div class="bar">
    <button id="fs" type="button">Full screen</button>
    <span class="keys"><kbd>←</kbd> <kbd>→</kbd> move</span>
    <span class="keys"><kbd>Space</kbd> fire</span>
    <span class="keys"><kbd>P</kbd> pause</span>
    <span>Or drag on the screen to steer and fire</span>
    <button id="aud" type="button">Load local audio folder</button>
    <input id="audIn" type="file" multiple hidden>
    <span id="audStatus" aria-live="polite"></span>
    <button id="snd" type="button">Sound: on</button>
    <button id="crt" type="button">CRT: on</button>
    <button id="pz" type="button">Pause</button>
  </div>
</div>

  for (const r of rescues) spr(r.t < 1 ? SPR.playerRed : SPR.player, r.x, r.y, r.angle);
  for (const b of bullets) {
    ctx.fillStyle = '#f4f1ff'; ctx.fillRect(b.x - 0.5, b.y - 3, 1, 6);
    ctx.fillStyle = '#ff3b5c'; ctx.fillRect(b.x - 0.5, b.y + 2, 1, 1);
  }
  if (player.alive && (player.inv <= 0 || (time * 12 | 0) % 2 === 0)) {
    const flick = (time * 24 | 0) % 2;
    for (const x of shipXs()) {
      ctx.fillStyle = flick ? '#ffd23a' : '#ff8a2a';
      ctx.fillRect(x - 2.5, player.y + 6, 1, 2 + flick); ctx.fillRect(x + 1.5, player.y + 6, 1, 2 + flick);
      spr(SPR.player, x, player.y);
    }
    if (flashT > 0) {
      ctx.globalAlpha = flashT / 0.45; ctx.fillStyle = '#f4f1ff';
      for (const x of shipXs()) ctx.fillRect(x - 7, player.y - 6, 14, 12);
      ctx.globalAlpha = 1;
    }
  }
  for (const r of rings) { ctx.globalAlpha = 1 - r.t / 0.3; ctx.strokeStyle = r.c; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(r.x, r.y, 2 + r.t * 40, 0, TAU); ctx.stroke();
    if (r.t < 0.16) { ctx.fillStyle = '#f4f1ff'; for (let i = 0; i < 8; i++) { const a = i * TAU / 8, L = 3 + r.t * 70; ctx.fillRect(r.x + Math.cos(a) * L - 0.5, r.y + Math.sin(a) * L - 0.5, 1, 1); } }
  }
  ctx.globalAlpha = 1;
  for (const p of parts) { ctx.fillStyle = p.c; const s = p.life > 0.45 ? 2 : 1; ctx.fillRect(p.x, p.y, s, s); }
  for (const p of popups) text(p.text, p.x, p.y, p.c);

  drawHUD();
  if (msg) {
    text(msg.text, W / 2, 150, msg.col, 8);
    if (msg.sub) text(msg.sub, W / 2, 162, '#8c86bd');
  }
  if (readyT > 0 && state === 'play') text('READY', W / 2, 160, '#ff3b5c');
  if (demo && (time * 1.6 | 0) % 2 === 0) text('PRESS SPACE OR TAP', W / 2, 200, '#f4f1ff');
  if (state === 'result') {
    text('NUMBER OF HITS', W / 2, 130, '#3ad6ff');
    text(challengeHits + ' / ' + challengeTotal, W / 2, 142, '#f4f1ff');
    if (challengeHits === challengeTotal) { text('PERFECT !', W / 2, 162, '#ffd23a'); text('SPECIAL BONUS 20000 PTS', W / 2, 174, '#ffd23a'); }
    else text('BONUS  ' + challengeHits * 100, W / 2, 162, '#ffd23a');
  }
  if (state === 'over') {
    text('GAME OVER', W / 2, 120, '#ff3b5c', 16);
    if (stateT > 1.2) {
      const ratio = shots ? (hits / shots * 100).toFixed(1) : '0.0';
      text('- RESULTS -', W / 2, 148, '#ffd23a');
      text('SHOTS FIRED  ' + shots, W / 2, 162, '#f4f1ff');
      text('NUMBER OF HITS  ' + hits, W / 2, 174, '#f4f1ff');
      text('HIT-MISS RATIO  ' + ratio + '%', W / 2, 186, '#f4f1ff');
    }
  }
  if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H); text('PAUSED', W / 2, H / 2, '#ffd23a', 16); }
  if (crtOn) drawCRT();
}

/* ---------- input ---------- */
const keys = { left: false, right: false, fire: false };
const pointer = { down: false, x: W / 2 };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'fire', KeyZ: 'fire', KeyX: 'fire', ArrowUp: 'fire' };
function startOrContinue() {
  ensureAudio();
  if (state === 'title' && stateT > 0.3) { startGame(false); return true; }
  if (state === 'play' && demo) { toTitle(); return true; }
  if (state === 'over' && stateT > 2.5) { finishOver(); return true; }
  return false;
}
window.addEventListener('keydown', ev => {
  const k = KEYMAP[ev.code];
  if (k || ev.code === 'Enter' || ev.code === 'ArrowDown') ev.preventDefault();
  if (state === 'entry') {
    if (ev.repeat && !(ev.code === 'ArrowLeft' || ev.code === 'ArrowRight')) return;
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowDown') entryInput('prev');
    else if (ev.code === 'ArrowRight' || ev.code === 'ArrowUp') entryInput('next');
    else if (ev.code === 'Space' || ev.code === 'Enter' || ev.code === 'KeyZ') entryInput('ok');
    else if (ev.code === 'Backspace') entryInput('back');
    else if (/^Key[A-Z]$/.test(ev.code)) { entry.letters[entry.idx] = CHARS.indexOf(ev.code[3]); entryInput('ok'); }
    return;
  }
  if (ev.code === 'KeyP' || ev.code === 'Escape') { togglePause(); return; }
  if (ev.code === 'KeyM') { toggleMute(); return; }
  if (ev.code === 'KeyC') { toggleCRT(); return; }
  if (k === 'fire' || ev.code === 'Enter' || (demo && k)) { if (startOrContinue()) return; }
  if (!k) return;
  if (k === 'fire' && !keys.fire && !ev.repeat) { ensureAudio(); tryFire(); player.fireCd = 0.25; }
  keys[k] = true;
});
window.addEventListener('keyup', ev => { const k = KEYMAP[ev.code]; if (k) keys[k] = false; });
function toLocal(ev) { const r = cv.getBoundingClientRect(); return (ev.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  ensureAudio();
  if (state === 'entry') { const x = toLocal(ev); entryInput(x < W / 3 ? 'prev' : x > W * 2 / 3 ? 'next' : 'ok'); return; }
  if (startOrContinue()) return;
  if (paused) { togglePause(); return; }
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  pointer.down = true; pointer.x = toLocal(ev);
  tryFire(); player.fireCd = 0.25;
});
cv.addEventListener('pointermove', ev => { if (pointer.down) pointer.x = toLocal(ev); });
const release = () => { pointer.down = false; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
window.addEventListener('blur', () => { keys.left = keys.right = keys.fire = false; pointer.down = false; if (state === 'play' && !demo) paused = true; syncButtons(); });

const sndBtn = document.getElementById('snd'), pzBtn = document.getElementById('pz'), crtBtn = document.getElementById('crt');
function syncButtons() {
  sndBtn.textContent = 'Sound: ' + (muted ? 'off' : 'on');
  pzBtn.textContent = paused ? 'Resume' : 'Pause';
  crtBtn.textContent = 'CRT: ' + (crtOn ? 'on' : 'off');
  cv.classList.toggle('crt', crtOn);
}
function toggleMute() { muted = !muted; save('hw88-muted', muted); ensureAudio(); humN = -1; syncButtons(); }
function togglePause() { if ((state !== 'play' && state !== 'result') || demo) return; paused = !paused; syncButtons(); }
function toggleCRT() { crtOn = !crtOn; save('hw88-crt', crtOn); syncButtons(); }
sndBtn.addEventListener('click', toggleMute);
crtBtn.addEventListener('click', toggleCRT);
pzBtn.addEventListener('click', () => { ensureAudio(); togglePause(); });
syncButtons();

// on-screen pad for phones and tablets
for (const btn of document.querySelectorAll('.pad button')) {
  const k = btn.dataset.k;
  const press = ev => {
    ev.preventDefault();
    ensureAudio();
    try { btn.setPointerCapture(ev.pointerId); } catch (e) {}
    btn.classList.add('on');
    if (state === 'entry') { entryInput(k === 'left' ? 'prev' : k === 'right' ? 'next' : 'ok'); return; }
    if (k === 'fire' && startOrContinue()) return;
    if (paused) { togglePause(); return; }
    if (k === 'fire' && !keys.fire) { tryFire(); player.fireCd = 0.25; }
    keys[k] = true;
  };
  const lift = () => { btn.classList.remove('on'); keys[k] = false; };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', lift);
  btn.addEventListener('pointercancel', lift);
  btn.addEventListener('lostpointercapture', lift);
  btn.addEventListener('contextmenu', ev => ev.preventDefault());
}

// local audio folder picker (folder where supported, otherwise multiple files)
const audBtn = document.getElementById('aud'), audIn = document.getElementById('audIn');
if ('webkitdirectory' in audIn && !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) audIn.webkitdirectory = true;
else audBtn.textContent = 'Load local audio files';
audBtn.addEventListener('click', () => { ensureAudio(); audIn.click(); });
audIn.addEventListener('change', () => { if (audIn.files && audIn.files.length) loadLocalAudio(Array.from(audIn.files)); audIn.value = ''; });

// full screen where the browser allows it
const fsBtn = document.getElementById('fs');
const screenEl = document.getElementById('screen');
fsBtn.addEventListener('click', () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (screenEl.requestFullscreen) screenEl.requestFullscreen().catch(() => { fsBtn.textContent = 'Full screen unavailable'; });
    else fsBtn.textContent = 'Full screen unavailable';
  } catch (e) { fsBtn.textContent = 'Full screen unavailable'; }
});
document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
