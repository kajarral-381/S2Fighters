function arc(p, cx, cy, r, a0, a1) {

/* ---------- effects ---------- */
function burst(x, y, cols, n = 14, sp = 60) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(sp * 0.3, sp);

  }
  rings.push({ x, y, t: 0, c: cols[0] });
}

/* ---------- attacks ---------- */
function loopStart(e) {
  const dir = e.x < W / 2 ? -1 : 1;
  const p = [[e.x, e.y]];
  arc(p, e.x + dir * 12, e.y, 12, dir < 0 ? 0 : Math.PI, dir < 0 ? -Math.PI : TAU);
  return [p, dir];
}
function plungePath(e) {
  const px = clamp(player.x + rnd(-22, 22), 16, W - 16);
  const [p, dir] = loopStart(e);
  const [lx, ly] = p[p.length - 1];
  return spline(p, [[lx + dir * 6, ly + 40], [px - dir * 36, 170], [px + dir * 16, 232], [px - dir * 10, H + 24]]);
}
function swoopPath(e) {
  const px = clamp(player.x + rnd(-16, 16), 50, W - 50);
  const [p] = loopStart(e);
  const [lx, ly] = p[p.length - 1];
  spline(p, [[lerp(lx, px, 0.4), ly + 50], [px, 196]]);
  const s = px < W / 2 ? 1 : -1;

}
function launch(e, path, st = 'dive') {
  e.path = path; e.pi = 0; e.state = st; e.speed = diveSpeed();
  e.shots = Math.random() < Math.min(0.85, 0.45 + stage * 0.05) ? (stage >= 3 && Math.random() < 0.5 ? 2 : 1) : 0;
  e.shotCd = rnd(0.15, 0.6);
}
function enemyFire(e) {

  ebullets.push({ x: e.x, y: e.y + 6, vx: clamp((player.x - e.x) / t + rnd(-10, 10), -50, 50), vy });

}
function follow(lead, path, w, ox, oy) { launch(w, [[w.x, w.y], ...path.slice(1).map(([x, y]) => [x + ox, y + oy])]); }
function pickDiver() {

  if (!pool.length) return;
  const cmds = pool.filter(e => e.type === 'cmd');
  if (cmds.length && Math.random() < 0.24) {
    const c = pick(cmds);
    const beamBusy = enemies.some(e => e.state === 'beam' || e.state === 'beamGo' || (e.captive && e.captive.state === 'rising'));
    if (!c.captive && !beamBusy && player.ships < 3 && Math.random() < 0.45) {
      const tx = clamp(player.x, 26, W - 26);
      const [p] = loopStart(c);

}
function startMorph() {

  if (ds.length < 3) return;
  const a = pick(ds);
  const trio = ds.sort((p, q) => Math.hypot(p.col - a.col, p.row - a.row) - Math.hypot(q.col - a.col, q.row - a.row)).slice(0, 3);

/* ---------- player ---------- */

function loseLife() {

/* ---------- demo pilot ---------- */
function demoPilot(dt) {
  let tx = player.x;
  const threats = enemies.filter(e => e.state !== 'form' && e.y > player.y - 70 && e.y < player.y + 12);
  const near = threats.filter(e => Math.abs(e.x - player.x) < 24);
  if (near.length) {
    const t = near[0];
    tx = player.x + (t.x > player.x ? -44 : 44);
    if (tx < 16 || tx > W - 16) tx = player.x - (tx - player.x);
  } else {
    const tg = enemies.filter(e => e.state === 'dive' || e.state === 'form' || e.state === 'beamGo' || e.state === 'home');
    if (tg.length) tx = tg.reduce((a, b) => (b.y > a.y ? b : a)).x;
  }

  for (const e of enemies) if (e.state === 'beam' && Math.abs(e.x - tx) < 30) tx = e.x + (tx < e.x ? -36 : 36);

/* ---------- update ---------- */
function update(dt) {
  time += dt;
  if (!paused) stateT += dt;
  const targetMul = state === 'play' && !player.alive && !pendingOver ? 0.15 : 1;
  starMul = lerp(starMul, targetMul, Math.min(1, dt * 2));
  if (warpT > 0) warpT = Math.max(0, warpT - dt);
  const warp = warpFactor();
  for (const s of stars) { s.y += s.s * dt * starMul * warp; if (s.y > H) { s.y -= H; s.x = rnd(0, W); } }
  if (paused) { setHum(0); return; }
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = msg.next || null; }
  flashT = Math.max(0, flashT - dt);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < 0.3);
  for (const p of popups) { p.t += dt; p.y -= 10 * dt; }
  popups = popups.filter(p => p.t < 1.4);
  if (state === 'title' && stateT > 18) startGame(true);
  if (state === 'play' || state === 'result') updatePlay(dt);
  else setHum(0);
  if (state === 'over' && stateT > 6) finishOver();
  if (state === 'entry' && stateT > 40) { while (state === 'entry') entryInput('ok'); }
}
function warpFactor() { return warpT > 0 ? 1 + (warpDur > 2 ? 16 : 9) * Math.sin(Math.PI * (warpT / warpDur)) : 1; }

function updatePlay(dt) {

  }

      if ((keys.fire || pointer.down) && player.fireCd <= 0) { tryFire(); player.fireCd = 0.107; }

  if (player.alive && player.inv <= 0) {
    for (const b of ebullets) {
      const xs = shipXs();
      const i = xs.findIndex(x => Math.abs(x - b.x) < 5 && Math.abs(player.y - b.y) < 6);
      if (i < 0) continue;
      b.dead = true;
      burst(xs[i], player.y, BURST.player, 34, 80);
      sfx.boom();
      if (player.ships > 1) { removeShip(i); player.inv = 0.6; }
      else { player.alive = false; loseLife(); break; }
    }

    const path = plungePath(l);
    launch(l, path);
    rest.forEach((w, i) => follow(l, path, w, i ? 14 : -14, 6));
    g.forEach(e => { e.morphReady = false; });
    sfx.dive();
  }

  // bullets vs enemies and held captives
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead || e.state === 'flee') continue;
      if (e.captive && e.captive.state === 'held') {
        const [cx, cy] = captivePos(e);
        if (Math.abs(b.x - cx) < 6 && Math.abs(b.y - cy) < 7) {
          b.dead = true; burst(cx, cy, ['#ff6a85', '#ffd23a'], 16); sfx.hit();
          popups.push({ x: cx, y: cy - 6, text: 'SHIP LOST', t: 0, c: '#ff3b5c' });
          e.captive = null; break;
        }
      }
      const r = e.type === 'cmd' ? 7 : e.type === 'shard' ? 4 : 6;
      if (Math.abs(b.x - ex(e)) < r && Math.abs(b.y - e.y) < r + 1) {
        b.dead = true;
        if (--e.hp <= 0) killEnemy(e); else { sfx.ding(); if (!demo) hits++; }
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // dives into the fighter
  if (player.alive && player.inv <= 0) {
    for (const e of enemies) {
      if (e.dead || e.challenge || e.state === 'form' || e.state === 'flee') continue;
      const xs = shipXs();
      const i = xs.findIndex(x => Math.abs(x - e.x) < 9 && Math.abs(player.y - e.y) < 9);
      if (i < 0) continue;
      killEnemy(e);
      burst(xs[i], player.y, BURST.player, 34, 80);
      sfx.boom();
      if (player.ships > 1) { removeShip(i); player.inv = 0.6; }
      else { player.alive = false; loseLife(); break; }
    }

  enemies = enemies.filter(e => !e.dead);

  capsules = capsules.filter(c => !c.done);

  // rescued fighters fly down and merge

    if (r.t < 1.0) { r.angle += dt * 14; continue; }
    r.angle = lerpAngle(r.angle, 0, Math.min(1, dt * 8));
    const tx = player.alive ? player.x + 7 * (player.ships + 1) : W / 2, ty = player.y;
    const dx = tx - r.x, dy = ty - r.y, L = Math.hypot(dx, dy), st = 95 * dt;
    if (L <= st) {

      if (player.alive && player.ships < 3) { player.ships++; player.x += 7; clampPlayer(); }
      else lives++;

      burst(tx, ty, ['#33e07a', '#f4f1ff', '#3ad6ff'], 20, 50);
      popups.push({ x: tx, y: ty - 14, text: player.ships === 3 ? 'TRIPLE FIGHTER' : player.ships === 2 ? 'DUAL FIGHTER' : 'DOCKED', t: 0, c: '#33e07a' });
    } else { r.x += dx / L * st; r.y += dy / L * st; }
  }

      const left = enemies.length;
      diveT = rnd(0.9, 2.0) * Math.max(0.35, 1 - stage * 0.05) * (left <= 10 ? 0.5 : 1);
      const divers = enemies.filter(e => e.state === 'dive' || e.state === 'beamGo' || e.state === 'beam').length;
      if (divers < Math.min(7, 2 + Math.floor(stage / 2))) pickDiver();

  }
  setHum(enemies.filter(e => e.state === 'dive' || e.state === 'beamGo' || e.state === 'shard').length);

  // demo ends on a lost fighter or after a while

  }

    if (pendingOver) { overT -= dt; if (overT <= 0) { state = 'over'; stateT = 0; } }
    else if (pendingRespawn) {
      respawnT -= dt;
      const busy = ebullets.length > 0 || enemies.some(e => !e.challenge && (e.state === 'dive' || e.state === 'beam' || e.state === 'beamGo' || e.state === 'shard'))
        || enemies.some(e => e.captive && e.captive.state === 'rising');
      if (respawnT <= 0 && (!busy || respawnT < -8)) { pendingRespawn = false; readyT = 1.4; }
    } else if (readyT > 0) {
      readyT -= dt;
      if (readyT <= 0) Object.assign(player, { alive: true, x: W / 2, ships: 1, inv: 2.0 });
    }
  }

  // stage end, with a breather between waves
  if (state === 'play' && !queue.length && !enemies.length && !rescues.length && player.alive) {
    if (isChallenge()) {
      state = 'result'; stateT = 0;
      const perfect = challengeHits === challengeTotal;
      addScore(perfect ? 20000 : challengeHits * 100);
      if (perfect) sfx.perfect(); else sfx.stage();
    } else if (clearT < 0) {
      clearT = pendingJump ? 2.6 : 2.0;
      if (!demo) {
        const bonus = 300 * stage + (stageMiss ? 0 : 2000);
        addScore(bonus); sfx.ding();
        say('STAGE CLEAR  +' + bonus, 2, '#33e07a', stageMiss ? '' : 'NO MISS BONUS 2000');
      }
    }
  }
  if (clearT >= 0 && state === 'play') { clearT -= dt; if (clearT < 0) nextStage(); }
  if (state === 'result' && stateT > 4) { state = 'play'; nextStage(); }
}

  if (startOrContinue()) return;
  if (paused) { togglePause(); return; }
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  pointer.down = true; pointer.x = toLocal(ev);
  tryFire(); player.fireCd = 0.117;
});
cv.addEventListener('pointermove', ev => { if (pointer.down) pointer.x = toLocal(ev); });
const release = () => { pointer.down = false; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
window.addEventListener('blur', () => { keys.left = keys.right = keys.fire = false; pointer.down = false; if (state === 'play' && !demo) paused = true; syncButtons(); });

const sndBtn = document.getElementById('snd'), pzBtn = document.getElementById('pz'), crtBtn = document.getElementById('crt');
function syncButtons() {
  sndBtn.textContent = 'Sound: ' + (muted ? 'off' : 'on');
  pzBtn.textContent = paused ? 'Resume' : 'Pause';
  crtBtn.textContent = 'CRT: ' + (crtOn ? 'on' : 'off');
  cv.classList.toggle('crt', crtOn);
}
function toggleMute() { muted = !muted; save('hw88-muted', muted); ensureAudio(); humN = -1; syncButtons(); }
function togglePause() { if ((state !== 'play' && state !== 'result') || demo) return; paused = !paused; syncButtons(); }
function toggleCRT() { crtOn = !crtOn; save('hw88-crt', crtOn); syncButtons(); }
sndBtn.addEventListener('click', toggleMute);
crtBtn.addEventListener('click', toggleCRT);
pzBtn.addEventListener('click', () => { ensureAudio(); togglePause(); });
syncButtons();

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
